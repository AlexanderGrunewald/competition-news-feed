[workspace]
channels = ["conda-forge"]
name = "competition-news-feed"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
start = "streamlit run app.py"

[dependencies]
python = "3.14.*"
rich = ">=15.0.0,<16"
streamlit = ">=1.63.0,<2"
pandas = ">=3.0.5,<4"

[pypi-dependencies]
tavily-python = ">=0.8.2, <0.9"

[feature.test.dependencies]
pytest = "*"
flake8 = "*"

[feature.test.tasks]
lint = "flake8 . --exclude .pixi,.git,__pycache__ --count --select=E9,F63,F7,F82 --show-source --statistics"
test = "pytest"

[environments]
default = ["test"]

[activation]
scripts = ["load_env.sh"]